<style>
/* shared engine for the banker-page variants: flow-height stages, animated gradient borders, continuous connector */
.bp{height:auto}
.bp *{box-sizing:border-box}
.pf{display:inline-block;flex:none;overflow:hidden;background:#0b0b0d}
.pf img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:none;mix-blend-mode:normal}

@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
.gb{position:relative;z-index:3}
.gb::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--ga),var(--gb0) 0deg,var(--gb0) 200deg,var(--gb1) 260deg,var(--gb2) 300deg,var(--gb1) 330deg,var(--gb0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:gbspin var(--gbt,7s) linear infinite}
@keyframes gbspin{to{--ga:360deg}}
.gb.tr::before{animation:none;transition:--ga .25s linear}

.conn{position:absolute;left:0;top:0;width:1440px;pointer-events:none;z-index:2;overflow:visible}
.conn path{fill:none;stroke-linejoin:round;stroke-linecap:round}
.cn{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cnc,#111);z-index:4;box-shadow:0 0 0 4px var(--cnr,rgba(0,0,0,.08))}
.cn.h{opacity:0}
.bp .ti{display:inline-block;width:18px;height:18px;flex:none;vertical-align:middle}
.lift{position:relative;z-index:3}
.bp h1,.bp h2,.bp h3{text-wrap:balance}
.bp p{text-wrap:pretty}
@media (prefers-reduced-motion:reduce){.gb::before{animation:none}}
</style>
